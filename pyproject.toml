[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-vision-lab"
version = "0.1.0"
description = "Validated classical computer-vision geometry utilities and diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "opencv-python>=4.10"]

[tool.setuptools]
py-modules = ["vision_geometry"]

[tool.ruff]
line-length = 100
